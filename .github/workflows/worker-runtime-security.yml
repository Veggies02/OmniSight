name: M3.1 Container Runtime Security Validation

on:
  push:
    branches:
      - feature/ajay-security-sandbox
  pull_request:
    branches:
      - feature/ajay-security-sandbox
  workflow_dispatch:

jobs:
  validate-container-runtime:
    name: Linux Container Runtime Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Run worker service automated tests
        run: |
          python -m pytest test_crypto_approval.py -v
          python -m pytest test_execution_runner.py -v
          python -m pytest test_worker_service.py -v
          python -m pytest test_adversarial_security.py -v
          python -m pytest test_worker_reliability.py -v

      - name: Generate authoritative approval signing keypair and enforce key rotation
        run: |
          python -c "
          from crypto_approval import ApprovalSigner
          import os

          # Rotate keypair to version 2; invalidate prior compromised key IDs
          signer = ApprovalSigner.generate(key_id='omnisight-qa-root-v2')
          priv_hex = signer.private_key_hex
          pub_hex = signer.public_key_hex

          # 1. Mask private key value from GitHub Actions logs immediately
          print(f'::add-mask::{priv_hex}')

          # 2. Export environment variables to GITHUB_ENV
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'OMNISIGHT_APPROVAL_PUBLIC_KEY_HEX={pub_hex}\n')
              f.write(f'OMNISIGHT_APPROVAL_PRIVATE_KEY_HEX={priv_hex}\n')
              f.write('OMNISIGHT_APPROVAL_KEY_ID=omnisight-qa-root-v2\n')
              f.write('OMNISIGHT_REVOKED_KEY_IDS=omnisight-qa-root,omnisight-qa-root-v1\n')
          "

      - name: Validate Compose Configuration
        run: |
          docker compose -f docker-compose.worker.yml config

      - name: Build hardened worker container image
        run: |
          docker compose -f docker-compose.worker.yml build

      - name: Launch isolated worker container
        run: |
          echo "Starting worker container..."
          docker compose -f docker-compose.worker.yml up -d
          echo "Waiting for container health check..."
          for i in $(seq 1 30); do
            HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' omnisight-execution-worker 2>/dev/null || echo "not_running")
            echo "Attempt $i/30: Container health = $HEALTH"
            if [ "$HEALTH" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          docker logs omnisight-execution-worker --tail 100 || true
          docker ps -a

      - name: Inspect running container configuration
        run: |
          docker inspect omnisight-execution-worker > container_inspect.json
          docker ps -a --filter "name=omnisight-execution-worker"

      - name: Execute live container runtime security auditor
        run: |
          python scripts/validate_container_runtime.py

      - name: Execute worker performance benchmark
        run: |
          python scripts/benchmark_worker.py --url http://127.0.0.1:8080 --out docs/runtime-evidence/worker_benchmark_report.json

      - name: Display runtime security evidence
        if: always()
        run: |
          if [ -f m3_1_runtime_security_evidence.json ]; then
            cat m3_1_runtime_security_evidence.json
          fi

      - name: Upload runtime security audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-1-runtime-security-evidence
          path: |
            m3_1_runtime_security_evidence.json
            container_inspect.json
            docs/runtime-evidence/worker_benchmark_report.json

      - name: Commit and push runtime security evidence
        if: always()
        run: |
          mkdir -p docs/runtime-evidence
          cp m3_1_runtime_security_evidence.json docs/runtime-evidence/ 2>/dev/null || true
          cp container_inspect.json docs/runtime-evidence/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/runtime-evidence/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ci): capture container runtime security evidence from Linux runner" && git push)

      - name: Container teardown
        if: always()
        run: |
          docker compose -f docker-compose.worker.yml down -v || true
