version: "3.8"

# ==============================================================================
# OmniSight Isolated Execution Worker - Development Compose Override
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.worker.yml -f docker-compose.worker.dev.yml up
# ==============================================================================

services:
  omnisight-worker:
    restart: "no"
    environment:
      - OMNISIGHT_ENVIRONMENT=development
      - LOG_FORMAT=text
      - LOG_LEVEL=DEBUG
      - OMNISIGHT_WORKER_AUTH_TOKEN=dev-worker-auth-token-1234
      - OMNISIGHT_WEBHOOK_SECRET=dev-webhook-secret-key-1234
      - OMNISIGHT_ENFORCE_APPROVAL_SIGNATURES=0
      - OMNISIGHT_ENFORCE_SANDBOX=0
      - SECURITY_SANDBOX_REQUIRED=0
      - STRICT_CONTAINER_SECURITY=0

